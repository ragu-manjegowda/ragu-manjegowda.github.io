<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%">
  <title>Keyboard to living room: four navigation keys and a TV pointer</title>
  <style>
    :root {
      --wall-edge: #e4dcc5; --wall: #fdf6e3; --frame: #eee8d5;
      --key-face: #f7efda; --rim: #718580; --detail: #97a9a3; --ink: #073642;
      --glass: #d2e4dc; --tile: #bad7cb; --tile-blue: #c2dbe3; --tile-violet: #d3d6e5;
      --selection: #617000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --wall-edge: #1d5059; --wall: #073642; --frame: #002b36;
        --key-face: #245661; --rim: #83aaa6; --detail: #52777a; --ink: #eee8d5;
        --glass: #175763; --tile: #20625f; --tile-blue: #265c6f; --tile-violet: #324e65;
        --selection: #b3c66b;
      }
    }
  </style>
  <defs>
    <linearGradient id="wall" x2="1" y2=".4" gradientUnits="objectBoundingBox">
      <stop stop-color="var(--wall-edge)"/><stop offset=".4" stop-color="var(--wall)"/>
      <stop offset=".64" stop-color="var(--wall)"/><stop offset="1" stop-color="var(--wall-edge)"/>
    </linearGradient>
    <linearGradient id="glass" x2=".9" y2="1">
      <stop stop-color="var(--glass)"/><stop offset="1" stop-color="var(--frame)"/>
    </linearGradient>
    <pattern id="grain" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="var(--rim)" opacity=".22"/>
    </pattern>
    <g id="key" stroke-linejoin="round" stroke-width="2">
      <rect x="0" y="4" width="52" height="47" rx="7" fill="var(--frame)" stroke="var(--detail)"/>
      <rect width="52" height="43" rx="7" fill="var(--key-face)" stroke="var(--rim)"/>
    </g>
  </defs>
  <rect width="100%" height="100%" fill="url(#wall)"/>
  <rect width="100%" height="100%" fill="url(#grain)"/>
  <svg x="0" y="0" width="32%" height="100%" viewBox="0 0 410 340" preserveAspectRatio="xMinYMax meet">
    <g transform="translate(-46 166) rotate(-10)" stroke-linejoin="round">
      <rect x="2" y="7" width="393" height="192" rx="17" fill="var(--detail)"/>
      <rect width="393" height="188" rx="17" fill="var(--frame)" stroke="var(--rim)" stroke-width="3"/>
      <g fill="var(--key-face)" stroke="var(--detail)" stroke-width="2">
        <rect x="18" y="14" width="357" height="29" rx="5"/>
        <path d="M52 14v29m52-29v29m52-29v29m52-29v29m52-29v29m52-29v29"/>
        <rect x="18" y="117" width="357" height="44" rx="6"/>
        <path d="M65 117v44m236-44v44"/>
      </g>
      <g transform="translate(63 55)">
        <use xlink:href="#key"/><use x="62" xlink:href="#key"/>
        <use x="124" xlink:href="#key"/><use x="186" xlink:href="#key"/>
        <g fill="var(--ink)" font-family="monospace" font-size="24" text-anchor="middle">
          <text x="26" y="30">h</text><text x="88" y="30">j</text>
          <text x="150" y="30">k</text><text x="212" y="30">l</text>
        </g>
      </g>
    </g>
  </svg>
  <svg x="69%" y="0" width="31%" height="100%" viewBox="0 0 410 340" preserveAspectRatio="xMaxYMin meet">
    <g stroke-linejoin="round" stroke-linecap="round">
      <path d="m127 234-18 19m214-19 18 19" fill="none" stroke="var(--rim)" stroke-width="6"/>
      <rect x="48" y="46" width="346" height="188" rx="10" fill="var(--frame)" stroke="var(--rim)" stroke-width="3"/>
      <rect x="58" y="56" width="326" height="165" rx="4" fill="url(#glass)"/>
      <rect x="75" y="78" width="124" height="8" rx="4" fill="var(--rim)"/>
      <g stroke="var(--detail)" stroke-width="2">
        <rect x="75" y="105" width="91" height="57" rx="6" fill="var(--tile)" stroke="var(--selection)" stroke-width="3"/>
        <rect x="177" y="105" width="91" height="57" rx="6" fill="var(--tile-blue)"/>
        <rect x="279" y="105" width="86" height="57" rx="6" fill="var(--tile-violet)"/>
      </g>
      <path d="m114 124 13 10-13 10z" fill="var(--ink)"/>
      <path d="M78 180h117m-117 12h71" stroke="var(--detail)" stroke-width="4"/>
      <path d="m247 141 5 38 9-12 15 1z" fill="var(--ink)" stroke="var(--frame)" stroke-width="3"/>
      <circle cx="378" cy="227" r="2" fill="var(--selection)"/>
    </g>
  </svg>
</svg>
